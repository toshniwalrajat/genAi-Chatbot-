
spring.application.name=local-genai-chatbot

server.port=8080

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/genai_chatbot_db
spring.datasource.username=root
spring.datasource.password=root

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true

# LM Studio Configuration
lmstudio.base-url=http://localhost:1235
lmstudio.model=qwen2.5-coder-1.5b-instruct
lmstudio.temperature=0.2
lmstudio.max-tokens=512
lmstudio.timeout-seconds=180

# CostGuard
chat.max-input-characters=2000
chat.requests-per-minute=10

# Cache
chat.cache-ttl-seconds=600

# Image Generation
image.mock-mode=true

# OpenAI Image Generation
openai.api-key=${OPENAI_API_KEY:}
openai.image-model=gpt-image-1-mini


# Speech-to-text
speech.mock-mode=true

# OpenAI transcription
openai.transcription-model=gpt-transcribe

# Uploaded file limits
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB